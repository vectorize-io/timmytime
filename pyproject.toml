[project]
name = "text2date"
version = "0.1.1"
description = "Finds the date ranges in a question (\"last week\", \"early 2024\") with a 9 MB numpy model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vectorize AI, Inc." }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "threadpoolctl>=3.1", "tzdata"]
keywords = ["date parsing", "temporal expressions", "natural language", "multilingual", "hindsight"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/vectorize-io/text2date"
Model = "https://huggingface.co/hindsight-ai/hs-date-1"
Dataset = "https://huggingface.co/datasets/hindsight-ai/hs-date-1-data"
Changelog = "https://github.com/vectorize-io/text2date/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]
# Everything under training/: torch for the model, and hindsight's old dateparser path to score against.
training = ["torch>=2.15.0", "dateparser>=1.5.0", "pydantic>=2.0.0", "regex>=2025.11.3"]

[tool.uv]
default-groups = ["dev", "training"]

[tool.pytest.ini_options]
testpaths = ["tests", "training/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package is text2date/ only. The weights are not in git: scripts/get_weights.sh fetches the
# Hugging Face file pinned in weights.lock before building, and `artifacts` puts it into the package.
[tool.hatch.build.targets.wheel]
packages = ["text2date"]
artifacts = ["text2date/weights/model.safetensors"]

[tool.hatch.build.targets.sdist]
include = ["/text2date", "/README.md", "/LICENSE", "/weights.lock"]
artifacts = ["text2date/weights/model.safetensors"]
