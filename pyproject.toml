[project]
name = "tlm"
version = "0.1.0"
description = "Finds the date ranges in a question (\"last week\", \"early 2024\") with a 9 MB numpy model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "tzdata"]

[dependency-groups]
dev = ["pytest>=8"]
# Everything under training/: torch for the model, and hindsight's old dateparser path to score against.
training = ["torch>=2.15.0", "dateparser>=1.5.0", "pydantic>=2.0.0", "regex>=2025.11.3"]

[tool.uv]
default-groups = ["dev", "training"]

[tool.pytest.ini_options]
testpaths = ["tests", "training/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The package is tlm/ only. The weights are not in git (see weights.lock): they are fetched
# before building, and `artifacts` puts the git-ignored file into the package.
[tool.hatch.build.targets.wheel]
packages = ["tlm"]
artifacts = ["tlm/weights/tlm.npz"]

[tool.hatch.build.targets.sdist]
include = ["/tlm", "/README.md", "/weights.lock"]
artifacts = ["tlm/weights/tlm.npz"]
