name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    # Builds tlm with the weights pinned in weights.lock inside, checks a clean install, and
    # attaches the wheel and sdist to a GitHub release named after the tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: scripts/get_weights.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
      - run: uv build
      - name: wheel has the weights and works on its own
        run: |
          unzip -l dist/*.whl | grep -q tlm/weights/tlm.npz
          uv venv /tmp/clean && VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "
          import tlm, datetime
          assert tlm.parse('what did I do last week', datetime.date(2026, 11, 18)) == [(datetime.date(2026, 11, 9), datetime.date(2026, 11, 15))]"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "tlm $GITHUB_REF_NAME" --notes "Weights: $(cut -d' ' -f1 weights.lock)"
        env:
          GH_TOKEN: ${{ github.token }}
